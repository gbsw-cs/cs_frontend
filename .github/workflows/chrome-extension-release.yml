name: Chrome Extension Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit the uploaded package for Chrome Web Store review"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "extension-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anjava-extend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build extension
        run: pnpm run build

      - name: Package extension
        run: pnpm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-prod
          path: anjava-extend/build/chrome-mv3-prod.zip

      - name: Publish to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_SKIP_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'false' && '1' || '0' }}
        run: pnpm run publish:chrome
