# Project-scoped Codex configuration. Loaded only after the repository is trusted.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_fallback_filenames = ["CODEX.md"]
project_doc_max_bytes = 65536

developer_instructions = """
Use AGENTS.md for developer, debugger, and reviewer responsibilities.
Consult .codex/rules/frontend.md for browser work, .codex/rules/fullstack.md for
cross-layer work, and .codex/rules/security.md for security-sensitive changes.
The workflow templates are in .codex/commands/.
Before completion, run available package scripts from the affected subproject.
Use npm in anjava/ and pnpm in anjava-extend/. Prefer lint, test, and build in
that order when those scripts exist. Also run typecheck and test:e2e when those
scripts exist and are relevant. Never claim a command passed unless it was run.
For Anjava web work, preserve auth redirects, webcam guide, extension guide,
dashboard data loading, and settings behavior. For Anjava extension work,
preserve popup login, chrome.storage.local state, baseline handoff, offscreen
detection, notifications, content-script toasts, and backend timeline sync.
"""

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800

[features]
hooks = true
